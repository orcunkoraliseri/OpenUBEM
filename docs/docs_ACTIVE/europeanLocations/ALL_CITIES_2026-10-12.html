<style>
:root{--bg:#f5f6f3;--panel:#ffffff;--fg:#1d2320;--muted:#5d6661;--line:#dde2dc;--ok:#3f8a5c;--warn:#c98a12;--bad:#c2452d;--plan:#4f76a8;--sel:#e9efe9;--todo:#e6e9e4;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1c211e;--fg:#e6ebe7;--muted:#9aa49e;--line:#2d3430;--ok:#5fb37f;--warn:#e0a53a;--bad:#e2664c;--plan:#77a0d4;--sel:#243029;--todo:#262c28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1c211e;--fg:#e6ebe7;--muted:#9aa49e;--line:#2d3430;--ok:#5fb37f;--warn:#e0a53a;--bad:#e2664c;--plan:#77a0d4;--sel:#243029;--todo:#262c28;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);display:flex;flex-direction:column}
header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
h1{font:600 clamp(1.4rem,3vw,1.9rem)/1.15 var(--display);margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem;max-width:90ch}
.wrap{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
nav{border-right:1px solid var(--line);overflow-y:auto;padding:12px}
.grp{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px 6px}
.city{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font:inherit}
.city:hover{border-color:var(--muted)}
.city[aria-selected="true"]{background:var(--sel);border-color:var(--ok)}
.city b{font-weight:600}
.city small{grid-column:1/-1;color:var(--muted);font-size:.8rem}
.chip{font:500 .68rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--c);align-self:center;white-space:nowrap}
main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
iframe{flex:1;width:100%;border:0;background:var(--bg);min-height:70vh}
.card{padding:20px 16px;max-width:820px;display:grid;gap:14px}
.card h2{font:600 1.5rem/1.2 var(--display);margin:0}
.card .sub{color:var(--muted);margin:0}
dl{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:8px 16px;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
dt{color:var(--muted);font-size:.88rem}
dd{margin:0}
.note{border-left:4px solid var(--c);background:var(--panel);border-radius:6px;padding:10px 14px;margin:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.bar a{color:var(--plan)}
.bar{flex-wrap:wrap}
#fr{display:flex;flex-direction:column;flex:1;min-height:70vh;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;padding:5px 12px;border:0;background:var(--panel);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);font-weight:600}
.l3d{display:grid;grid-template-columns:minmax(6rem,9rem) auto auto;gap:8px 18px;align-items:baseline}
.l3d a{color:var(--plan)}
.prog{padding:20px 16px 40px;max-width:1000px;display:grid;gap:28px}
.prog h2{font:600 1.5rem/1.2 var(--display);margin:0}
.prog h3{font:600 1.15rem/1.2 var(--display);margin:0}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lede{color:var(--muted);margin:6px 0 0;max-width:72ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.track{display:grid;grid-template-columns:7.5rem repeat(7,minmax(0,1fr));gap:4px;align-items:center;font-size:.85rem}
.track .h{font:500 .66rem/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.track .n{font-weight:600}
.cell{height:26px;border-radius:4px;background:var(--todo);display:flex;align-items:center;justify-content:center;font:500 .7rem var(--mono);color:#fff}
.cell.done{background:var(--ok)} .cell.now{background:var(--plan)} .cell.stop{background:var(--warn)}
.cell.now::after{content:"now"} .cell.stop::after{content:"below"} .cell.done::after{content:"✓"}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:12px;height:12px;border-radius:2px}
.share{display:grid;gap:12px}
.srow{display:grid;grid-template-columns:7.5rem 1fr 6.5rem;gap:10px;align-items:center;font-size:.9rem}
.srow b{font-weight:600}
.sbar{position:relative;height:18px;border-radius:4px;background:var(--todo)}
.sbar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.sbar .m{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.sbar .m.g{background:var(--muted)}
.sval{font:500 .85rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.scale{display:grid;grid-template-columns:7.5rem 1fr 6.5rem;gap:10px;font:500 .7rem var(--mono);color:var(--muted)}
.scale div{position:relative;height:14px}
.scale div span{position:absolute;transform:translateX(-50%)}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.job{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.job p{margin:0;font-size:.9rem}
.job .tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.mini{height:8px;border-radius:4px;background:var(--todo);position:relative;overflow:hidden}
.mini span{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.small{font-size:.82rem;color:var(--muted)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}dl{grid-template-columns:1fr}
.track{grid-template-columns:5.5rem repeat(7,minmax(0,1fr));font-size:.78rem}.track .h{font-size:.56rem}.cell::after{font-size:.6rem}
.srow,.scale{grid-template-columns:5.5rem 1fr 5rem}}
</style>
</head>

</header>

const S = {built:["built","var(--ok)"],page:["plan page ready","var(--ok)"],fixing:["fixing floor plans","var(--warn)"],building:["building","var(--plan)"],progress:["overview","var(--plan)"],speed:["running on Speed","var(--plan)"],results:["results ready","var(--ok)"]};
const list = document.getElementById("list"), view = document.getElementById("view");
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pct(n){return (100*n).toFixed(1)}
function render(){
  let h = '<div class="grp">Start here</div><button class="city" role="tab" data-id="progress" aria-selected="false"><b>Progress</b><span class="chip" style="--c:var(--plan)">'+esc(ASOF.split(",")[0])+'</span><small>Where the six new cities stand</small></button>';
  for (const g of [["new","New for the 6th journal project"],["built","Built · 8 October set"]]) {
    h += '<div class="grp">'+g[1]+'</div>';
    for (const c of C.filter(x=>x.g===g[0])) {
      const s = S[c.status];
      h += '<button class="city" role="tab" data-id="'+c.id+'" aria-selected="false"><b>'+esc(c.name)+'</b><span class="chip" style="--c:'+s[1]+'">'+s[0]+'</span><small>'+esc(c.country)+' · '+esc(c.hood)+'</small></button>';
    }
  }
  list.innerHTML = h;
  list.addEventListener("click", e => { const b = e.target.closest(".city"); if (b) show(b.dataset.id); });

function links3d(){
  let t = '<div class="l3d">';
  for (const c of C) {
    t += '<b>'+esc(c.name)+'</b>';

}

  view.innerHTML = '<div class="prog">'+
   '<section><div class="eyebrow">Six new cities · position on '+esc(ASOF)+'</div><h2>All six new cities have results</h2><p class="lede">Montréal, Yerevan and Cape Town finished first; Helsinki, Vienna and Budapest finished on 12 October. No run failed. Seoul was dropped. Madrid, Lyon and Bologna are reused from the built set.</p></section>'+
   '<section class="panel"><h3>Steps per city</h3><p class="lede" style="margin-bottom:12px">Each city goes through the same seven steps as the four built cities.</p>'+tr+'</section>'+
   '<section class="panel"><h3>Homes with correctly divided floors</h3><p class="lede" style="margin-bottom:14px">Grey line: 85 %, below which work stops. Black line: your goal of about 95 %. The four built cities stopped at 94.4 % together.</p>'+sh+'</section>'+
   '<section class="panel"><h3>Energy runs finished on Speed</h3><p class="lede" style="margin-bottom:14px">Share of each city’s runs that have finished, as of '+esc(ASOF)+'. All 1,921 finished; none failed.</p>'+rb+'</section>'+
   '<section><div class="eyebrow">Jobs</div>'+jb+'</section>'+
   '<section class="panel"><h3>3D pages</h3><p class="lede" style="margin-bottom:12px">3D results colour each home by its heating need; 3D floor plans show the homes as simulated, with no energy result. Each opens in a new tab.</p>'+links3d()+'</section>'+
   '<section class="panel"><h3>What comes next</h3><p class="lede">A last check that every file agrees, then the files go to your 6th journal project. Nothing waits on you. Seoul’s leftover files are removed after the last city is built.</p></section>'+
   '</div>';
}
function show(id){
  const c = id==="progress" ? null : C.find(x=>x.id===id);
  const sel = c ? c.id : "progress";
  for (const b of list.querySelectorAll(".city")) b.setAttribute("aria-selected", b.dataset.id===sel ? "true" : "false");
  try { localStorage.setItem("allcities.sel2", sel); } catch(e) {}
  if (!c) { progress(); return; }
  const s = S[c.status];
  const note = c.note ? '<p class="note" style="--c:'+s[1]+'"><b>Status: '+s[0]+'.</b> '+esc(c.note)+'</p>' : '';
  let top;
  if (c.g==="built") top = '<div class="bar"><span>'+esc(c.name)+' · '+esc(c.hood)+' · '+esc(c.homes)+'</span></div>'+(note?'<div style="margin:10px 16px">'+note+'</div>':'');
  else top = '<div class="card"><h2>'+esc(c.name)+'</h2><p class="sub">'+esc(c.country)+' · '+esc(c.hood)+' · site '+esc(c.site)+'</p>'+note+
      '<dl><dt>Buildings and heights</dt><dd>'+esc(c.data)+'</dd><dt>Year built</dt><dd>'+esc(c.age)+'</dd><dt>Wall and window values</dt><dd>'+esc(c.build)+'</dd><dt>Weather</dt><dd>'+esc(c.wx)+'</dd><dt>Floor plans</dt><dd>Same steps as the built cities: homes cut per floor, windows from each building type\'s own window share.</dd></dl></div>';
  view.innerHTML = top + (c.v3 ? '<div id="fr" data-id="'+c.id+'">'+frame(c,"v")+'</div>' : '');
}
view.addEventListener("click", e => { const b = e.target.closest(".seg button"), f = document.getElementById("fr"); if (!b || !f) return; f.innerHTML = frame(C.find(x=>x.id===f.dataset.id), b.dataset.w); });
render();
let start = "progress";
try { start = localStorage.getItem("allcities.sel2") || start; } catch(e) {}
show(start);
</script>
