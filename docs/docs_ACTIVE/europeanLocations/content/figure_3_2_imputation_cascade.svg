<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Four-tier imputation cascade for European residential footprints</title>
  <desc id="desc">A left-to-right decision cascade from fusion through spatial, machine-learning, and statistical tiers, ending in validation or a blocked/excluded state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#172033}.sub{font:18px Arial,sans-serif;fill:#475569}.tier{font:700 22px Arial,sans-serif;fill:#172033}.body{font:18px Arial,sans-serif;fill:#334155}.yes{font:700 17px Arial,sans-serif;fill:#0f766e}.no{font:700 17px Arial,sans-serif;fill:#b45309}.box{stroke-width:2}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Four-tier imputation cascade</text>
  <text x="800" y="78" text-anchor="middle" class="sub">First valid tier wins; every accepted value retains a provenance token</text>

  <rect x="35" y="245" rx="18" width="210" height="110" fill="#eef2ff" stroke="#6366f1" class="box"/>
  <text x="140" y="286" text-anchor="middle" class="tier">Missing attribute</text><text x="140" y="318" text-anchor="middle" class="body">levels · year · height</text>

  <rect x="300" y="205" rx="18" width="245" height="190" fill="#eff6ff" stroke="#2563eb" class="box"/>
  <text x="422" y="248" text-anchor="middle" class="tier">Tier 1 · Fusion</text><text x="422" y="282" text-anchor="middle" class="body">Authoritative cadastral</text><text x="422" y="310" text-anchor="middle" class="body">or registered source match?</text><text x="422" y="354" text-anchor="middle" class="yes">YES → accept + FUSION</text>

  <rect x="600" y="205" rx="18" width="245" height="190" fill="#ecfeff" stroke="#0891b2" class="box"/>
  <text x="722" y="248" text-anchor="middle" class="tier">Tier 2 · Spatial</text><text x="722" y="282" text-anchor="middle" class="body">Eligible observed donor</text><text x="722" y="310" text-anchor="middle" class="body">within registered range?</text><text x="722" y="354" text-anchor="middle" class="yes">YES → accept + SPATIAL</text>

  <rect x="900" y="205" rx="18" width="245" height="190" fill="#f0fdf4" stroke="#16a34a" class="box"/>
  <text x="1022" y="248" text-anchor="middle" class="tier">Tier 3 · ML</text><text x="1022" y="282" text-anchor="middle" class="body">Opt-in model enabled,</text><text x="1022" y="310" text-anchor="middle" class="body">trained and in-domain?</text><text x="1022" y="354" text-anchor="middle" class="yes">YES → accept + ML</text>

  <rect x="1200" y="205" rx="18" width="245" height="190" fill="#fffbeb" stroke="#d97706" class="box"/>
  <text x="1322" y="248" text-anchor="middle" class="tier">Tier 4 · Statistical</text><text x="1322" y="282" text-anchor="middle" class="body">Registered stock</text><text x="1322" y="310" text-anchor="middle" class="body">distribution available?</text><text x="1322" y="354" text-anchor="middle" class="yes">YES → accept + STATISTICAL</text>

  <path d="M245 300 H300" class="line"/><path d="M545 300 H600" class="line"/><path d="M845 300 H900" class="line"/><path d="M1145 300 H1200" class="line"/>
  <text x="570" y="288" text-anchor="middle" class="no">NO</text><text x="870" y="288" text-anchor="middle" class="no">NO</text><text x="1170" y="288" text-anchor="middle" class="no">NO</text>

  <rect x="365" y="505" rx="18" width="690" height="100" fill="#f0fdfa" stroke="#0f766e" class="box"/>
  <text x="710" y="545" text-anchor="middle" class="tier">Independent validation</text><text x="710" y="578" text-anchor="middle" class="body">domain · confidence · constraints · immutable provenance</text>
  <path d="M422 395 V470 H565 V505" class="line"/><path d="M722 395 V505" class="line"/><path d="M1022 395 V470 H855 V505" class="line"/><path d="M1322 395 V445 H950 V505" class="line"/>

  <rect x="1165" y="520" rx="18" width="340" height="100" fill="#fef2f2" stroke="#dc2626" class="box"/>
  <text x="1335" y="560" text-anchor="middle" class="tier">BLOCKED / EXCLUDED</text><text x="1335" y="592" text-anchor="middle" class="body">No silent default when Tier 4 fails</text>
  <path d="M1445 300 H1515 V470 H1335 V520" class="line"/><text x="1480" y="288" text-anchor="middle" class="no">NO</text>
</svg>
