[package]
name = "openubem-results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Parallel SQLite/CSV/EIO/ABUPS EnergyPlus results harvester and Arrow/Parquet writer for OpenUBEM (zero pyo3)"

[dependencies]
arrow-array = "60.2.0"
arrow-buffer = "60.2.0"
arrow-schema = "60.2.0"
csv = "1.4.0"
fast-float2 = "0.2.4"
memchr = "2.8.3"
openubem-schema = { path = "../openubem-schema", version = "0.1.0" }
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "snap"] }
rayon.workspace = true
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror.workspace = true
