[package]
name = "openubem-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin PyO3 adapter exposing OpenUBEM Rust crates as openubem._rust"

[lib]
name = "_openubem_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
numpy = "0.30.0"
openubem-extrude = { path = "../openubem-extrude", version = "0.1.0" }
openubem-idf = { path = "../openubem-idf", version = "0.1.0" }
openubem-microclimate = { path = "../openubem-microclimate", version = "0.1.0" }
openubem-results = { path = "../openubem-results", version = "0.1.0" }
openubem-schema = { path = "../openubem-schema", version = "0.1.0" }
openubem-shading = { path = "../openubem-shading", version = "0.1.0" }
openubem-sim = { path = "../openubem-sim", version = "0.1.0" }
pyo3.workspace = true
pyo3-arrow = { version = "0.21.0", default-features = false }
rayon.workspace = true
thiserror.workspace = true

[build-dependencies]
pyo3-build-config = "0.30.1"
