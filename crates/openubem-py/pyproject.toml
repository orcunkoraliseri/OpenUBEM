[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "openubem-rust"
version = "0.1.0"
description = "Optional compiled Rust acceleration extension (openubem._rust) for OpenUBEM"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
dependencies = []

[tool.maturin]
module-name = "_openubem_rust"
manifest-path = "Cargo.toml"
features = ["extension-module"]
