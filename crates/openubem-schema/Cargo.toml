[package]
name = "openubem-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust physical units, provenance, flag normalization, and Arrow schema validation for OpenUBEM (zero pyo3, zero SQLite)"

[dependencies]
arrow-array = "60.2.0"
arrow-buffer = "60.2.0"
arrow-schema = "60.2.0"
nutype = { version = "0.8.0", features = ["serde"] }
rayon.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.16.6"
thiserror.workspace = true

[dev-dependencies]
proptest = "1.12.0"
