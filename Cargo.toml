[workspace]
resolver = "2"
members = [
    "crates/openubem-schema",
    "crates/openubem-results",
    "crates/openubem-shading",
    "crates/openubem-idf",
    "crates/openubem-sim",
    "crates/openubem-microclimate",
    "crates/openubem-extrude",
    "crates/openubem-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310", "generate-import-lib"] }
rayon = "1.12.0"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
