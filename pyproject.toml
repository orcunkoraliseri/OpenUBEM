[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openubem"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "osmnx >= 1.9, < 2.0",
    "geopandas >= 0.14",
    "shapely >= 2.0",
    "pandas",
    "numpy",
    "pyogrio",
    "packaging",
    "eppy >= 0.5.63, < 1.0",
    "geomeppy >= 0.11.8, < 1.0",
    "requests",
    "pyarrow",
    "pyproj",
    "scipy",
    "joblib",
    "matplotlib",
    "contextily >= 1.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "tenacity",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"openubem.data" = ["*.json", "*.csv"]
"openubem.data.construction" = ["*.json", "*.md"]
"openubem.data.loads" = ["*.json"]
"openubem.data.schedules" = ["*.json"]
"openubem.idf" = ["templates/*.idf"]
"openubem.data.climate_zones" = ["*.gpkg", "*.md"]
"openubem.data.carbon" = ["*.json", "*.md"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
addopts = "--basetemp=.pytest_tmp"
markers = [
    "slow: marks tests as slow (integration / live-network)",
    "energyplus: marks tests that require the EnergyPlus 23.1 binary",
]
