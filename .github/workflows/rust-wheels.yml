name: Rust Companion Extension (openubem-rust)

on:
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/**"
      - ".github/workflows/rust-wheels.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/**"
      - ".github/workflows/rust-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Check pure-Python uv lock without rustc (D-RS-01)
        shell: bash
        run: |
          PATH="/usr/local/bin:/usr/bin:/bin" uv lock --dry-run
      - name: Workspace unit & property tests
        run: |
          uv venv .venv --python 3.11
          PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --workspace --locked
      - name: Supply-chain license, ban & vulnerability audit (Guardrail 5)
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo deny --locked check
          cargo audit

  build-wheels:
    needs: rust-check-and-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            args: --release --locked --zig -m crates/openubem-py/Cargo.toml
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            args: --release --locked -m crates/openubem-py/Cargo.toml
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
            args: --release --locked -m crates/openubem-py/Cargo.toml
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            args: --release --locked -m crates/openubem-py/Cargo.toml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install zig for manylinux_2_17 EL7 glibc compatibility
        if: matrix.manylinux == '2_17'
        run: pip install ziglang
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: ${{ matrix.args }}
      - name: Smoke-test abi3 wheel import
        shell: bash
        run: |
          python -m pip install --no-index --find-links target/wheels openubem-rust
          python -c "import _openubem_rust as r; info = r.rust_smoke_info(); assert info['pyo3_abi'] == 'abi3-py310'; print(info)"
      - uses: actions/upload-artifact@v4
        with:
          name: openubem-rust-${{ matrix.target }}-${{ matrix.manylinux }}
          path: target/wheels/*.whl
